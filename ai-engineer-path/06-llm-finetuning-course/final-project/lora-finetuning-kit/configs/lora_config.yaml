model:
  name: "Qwen/Qwen2.5-7B"
  max_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  logging_steps: 10
  save_steps: 100
  output_dir: "./output"

data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  format: "alpaca"
