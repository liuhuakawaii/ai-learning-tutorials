name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: docker-cicd-course/final-project/production-launch-kit
        run: npm run check
      - working-directory: docker-cicd-course/final-project/production-launch-kit
        run: docker build -f Dockerfile.api -t production-launch-kit-api .
