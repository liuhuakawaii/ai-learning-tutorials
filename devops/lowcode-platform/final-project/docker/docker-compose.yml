# 低代码平台 Docker Compose 部署配置
# 使用方式：cd docker && docker-compose up -d

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: lowcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lowcode}
      POSTGRES_USER: ${POSTGRES_USER:-lowcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lowcode_secret_2024}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lowcode}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: lowcode-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-lowcode_redis_2024}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lowcode_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API 服务
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: lowcode-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lowcode}:${POSTGRES_PASSWORD:-lowcode_secret_2024}@postgres:5432/${POSTGRES_DB:-lowcode}
      REDIS_URL: redis://:${REDIS_PASSWORD:-lowcode_redis_2024}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-lowcode_jwt_secret_2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 前端静态资源服务
  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: lowcode-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
