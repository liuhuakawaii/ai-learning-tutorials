[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "toolbox"
version = "1.0.0"
description = "Python 自动化工具箱 - 文件处理、Web 监控、系统巡检、报表生成"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
toolbox = "toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
